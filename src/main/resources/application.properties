# --- Database: Supabase Postgres (session pooler, IPv4-friendly) ---
spring.datasource.url=jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.iorgldbdbekwtrclbynu
spring.datasource.password=${SUPABASE_DB_PASSWORD}

# NEVER let Hibernate touch the schema. Supabase owns the tables (built
# by hand in the SQL Editor); Java only reads/writes rows. none = look,
# don't touch.
spring.jpa.hibernate.ddl-auto=none

# --- Auth: validate Supabase-issued JWTs ---
# Spring fetches Supabase's public signing keys from this URL and uses
# them to verify each request's token signature. Supabase remains the
# identity authority; we only check ID cards at the door.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://iorgldbdbekwtrclbynu.supabase.co/auth/v1/.well-known/jwks.json

# Supabase signs tokens with ES256 (elliptic-curve); Spring assumes RS256
# unless told otherwise — without this line every real token is rejected.
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256